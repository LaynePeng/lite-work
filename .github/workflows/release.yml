name: Release Desktop Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-14
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync version from single source of truth
        shell: bash
        run: node scripts/sync-version.mjs && git diff --exit-code -- package.json web/package.json package-lock.json web/package-lock.json || (echo "Committed npm version files are out of sync with litework/__init__.py"; exit 1)
      - name: Verify release version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          npm_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$expected" != "${npm_version//-rc./rc}" && "$expected" != "$npm_version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${npm_version}"
            exit 1
          fi
      - name: Install Python packaging dependencies
        shell: bash
        run: python -m venv .venv && .venv/bin/pip install --upgrade pip && .venv/bin/pip install -e ".[dev,package]"
      - name: Install JavaScript dependencies
        shell: bash
        run: npm ci && npm --prefix web ci
      - name: Cache diagram-to-office node_modules
        uses: actions/cache@v4
        with:
          path: skills/diagram-to-office/node_modules
          key: ${{ runner.os }}-dto-${{ hashFiles('skills/diagram-to-office/package-lock.json') }}
      - name: Build macOS package
        shell: bash
        run: bash ./scripts/build-macos.sh --clean
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release/*.dmg
          if-no-files-found: error

  windows:
    name: Build Windows Installer
    runs-on: windows-2022
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync version from single source of truth
        shell: bash
        run: node scripts/sync-version.mjs && git diff --exit-code -- package.json web/package.json package-lock.json web/package-lock.json || (echo "Committed npm version files are out of sync with litework/__init__.py"; exit 1)
      - name: Verify release version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          npm_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$expected" != "${npm_version//-rc./rc}" && "$expected" != "$npm_version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${npm_version}"
            exit 1
          fi
      - name: Install JavaScript dependencies
        shell: pwsh
        run: npm ci; npm --prefix web ci
      - name: Cache diagram-to-office node_modules
        uses: actions/cache@v4
        with:
          path: skills/diagram-to-office/node_modules
          key: ${{ runner.os }}-dto-${{ hashFiles('skills/diagram-to-office/package-lock.json') }}
      - name: Build Windows package
        shell: pwsh
        run: .\scripts\build-windows.ps1 -Clean
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: dist
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          # Git tag 不一定都对应 GitHub Release，版本范围以已发布的 Release 为准。
          previous="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            range_label="项目首次 GitHub Release（完整项目历史）"
          else
            range_label="${previous}..${tag}"
          fi
          {
            echo "# lite-work ${tag}"
            echo
            echo "## 版本范围"
            echo "本说明覆盖 ${range_label} 之间的全部提交和功能变化。"
            echo
            echo "## 核心功能"
            echo "- 多窗口本地桌面模式：每个窗口拥有独立 Python Core、任务流、审批状态和 workspace。"
            echo "- 同一项目支持多个窗口，每个窗口独立维护会话 Tab、文件 Tab 和运行时状态。"
            echo "- 会话模型支持系统默认模型与当前会话独立模型，模型选择会持久化并在后续任务中生效。"
            echo "- 改进流式响应：安全 UTF-8 解码、React 实时缓冲、SSE 终止事件和 LLM 硬超时。"
            echo "- 停止任务支持协作式 abort、异步任务取消，以及 task ID 尚未返回时的延迟停止。"
            echo
            echo "## 项目与办公"
            echo "- 侧边栏「项目」页签：打开/新建项目与代码（新建代码默认 git init）、最近项目列表，先项目后对话的两级信息架构。"
            echo "- 产出物面板：ZIP 一键打包下载（含素材）、按 scope 清空、单文件删除。"
            echo "- Composer 支持粘贴图片与拖拽文件，上传即插入路径引用交给 Agent 处理。"
            echo "- Office 工具链：docx_create/docx_append 迭代写作、xlsx/pptx/pdf 生成、data_analyze 文件直读（xlsx/csv/json）、chart_make 图表。"
            echo "- diagram-to-office 技能：PlantUML/Mermaid 离线渲染成图嵌入 Word/PPT（@plantuml/core 纯 JS + resvg，无需 Java）。"
            echo
            echo "## 代码分析工具"
            echo "- get_file_outline 支持 Python、TypeScript、JavaScript、Java、Go。"
            echo "- read_focused_symbol 支持 Python、TypeScript、JavaScript、Java、Go。"
            echo "- Python 使用标准库 ast；TypeScript/JavaScript/Java/Go 使用对应 Tree-sitter grammar。"
            echo "- 支持类、函数、异步函数、方法和 Go 类型等符号提取，目标符号缺失和语法错误返回明确错误。"
            echo
            echo "## 安全与工程质量"
            echo "- 项目外文件读取和写入采用分级审批，读取授权不能升级为写入授权。"
            echo "- 交互区气泡类提示均有退出机制（TTL/随任务结束/手动关闭），UI 交互约定固化到 README。"
            echo "- Windows 构建在依赖未变化时跳过 pip 安装，PyInstaller 默认复用缓存，-Clean 用于干净发布构建。"
            echo
            echo "## 安装包"
            echo "- macOS Apple Silicon：\`*.dmg\`"
            echo "- Windows x64：\`*.exe\`"
            echo
            if [ -n "$previous" ]; then
              echo "## 完整提交列表（${previous} 到 ${tag}）"
              git log --reverse --pretty=format:'- %s (%h)' "${previous}..${tag}"
            else
              echo "## 完整提交列表（项目初始提交到 ${tag}）"
              git log --reverse --pretty=format:'- %s (%h)' "$tag"
            fi
          } > RELEASE_NOTES.md
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *rc* || "$GITHUB_REF_NAME" == *alpha* || "$GITHUB_REF_NAME" == *beta* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "lite-work $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md "${args[@]}"
