# CI 工作流：提交 / PR 时跑类型检查与测试。
# 与 release.yml（仅 tag 触发、负责打包发版）相互独立。

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

# 同一分支的旧运行自动取消，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 快速门禁：npm 侧版本字段必须与 litework/__init__.py 的 __version__ 一致
  # （v1.6.1 踩过的坑：改了版本号但没跑 sync-version，CI 打包才失败）
  version-sync:
    name: Version files in sync
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run sync-version and assert no drift
        shell: bash
        run: |
          node scripts/sync-version.mjs
          git diff --exit-code -- package.json web/package.json package-lock.json web/package-lock.json \
            || (echo "Committed npm version files are out of sync with litework/__init__.py"; exit 1)

  backend:
    name: Backend (mypy + pytest)
    runs-on: ubuntu-latest
    # 主依赖含 pandas / matplotlib / onnxruntime(rapidocr) / pymupdf，安装较慢
    timeout-minutes: 30
    env:
      # 事件负载严格校验（与 AGENTS.md 命令保持一致）
      LITEWORK_STRICT_EVENTS: "1"
      # 测试期禁止拉起图表引擎预装（npm install 后台线程）
      LITEWORK_SKIP_ENGINE_PREINSTALL: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Type check (mypy)
        run: .venv/bin/python -m mypy
      - name: Run backend tests
        run: .venv/bin/python -m pytest tests/ --timeout=120 -q

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Type check (tsc)
        working-directory: web
        run: npx tsc --noEmit
      - name: Run frontend tests
        working-directory: web
        run: npm test
      # Electron 主进程的 Core 令牌注入器：纯 Node 单测（无额外依赖）。
      # 回归「多项目窗口互相顶掉 Authorization 注入 → 先开窗口全部 401」。
      - name: Electron token injector tests (node:test)
        run: node --test tests/js/token-injector.test.mjs
      # 局域网共享决策逻辑（端口选择 / iPhone 热点网段识别与排序）。
      # 回归「多网卡时默认选中 192.168.x → iPhone 在热点网段够不着」与
      # 「共享端口随机 → 重启后手机书签失效」。
      - name: Electron LAN share tests (node:test)
        run: node --test tests/js/lan.test.mjs
      # 根 postinstall 的 CI 跳过判定：CI 里再嵌套调 npm，npm 10 会偶发
      # "Exit handler never called!" 把 release job 打死（v2.1.1 踩过）。
      # 用例只 import 脚本、不真的装包。
      - name: Root postinstall tests (node:test)
        run: node --test tests/js/postinstall.test.mjs
      # Core 退出判定：区分「主动回收」与「意外崩溃」。
      # 回归「Core 就绪后崩溃完全静默——不写日志也不通知窗口，用户只看到
      # 界面不动，线上闪退长期查无实据」。
      - name: Electron core health tests (node:test)
        run: node --test tests/js/core-health.test.mjs
      # ACP 协议契约：stdout 只能有合法 JSON-RPC、取消语义、错误不打死读循环。
      # 已含在 pytest 全量里，这里不重复跑（见 tests/test_acp.py）。
