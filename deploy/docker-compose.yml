# lite-work Core 单机部署（自托管：云上 VM 或局域网常开机皆可）。
# 安全边界：默认只绑 127.0.0.1（局域网/公网都扫不到），访问统一走
# Tailscale（tailscale serve 反代本机 8787，自动 HTTPS）+ 容器内 Bearer。
# 局域网直连场景用 LITEWORK_BIND=0.0.0.0 显式放开（无推送、勿在公共网络用）。
# 注意 Docker 发布端口会绕过 ufw——不要靠 ufw 兜底，公网暴露必须走反代+TLS+NSG。

services:
  core:
    # 两种形态任选：
    #   ① 预构建镜像（推荐，几十秒起）：注释掉 build:，改用
    #      image: ghcr.io/laynepeng/lite-work/core:2.0.0（或本地
    #      ./scripts/build-linux-image.sh 出来的 lite-work-core:2.0.0-linux-<arch>）；
    #   ② 源码构建（默认，首次十几分钟）：保留 build:，docker compose up -d --build
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lite-work-core:2.0.0
    container_name: lite-work-core
    restart: unless-stopped
    ports:
      # 默认回环：只有本机的 tailscale serve 能碰到。放开见文件头注释。
      - "${LITEWORK_BIND:-127.0.0.1}:8787:8787"
    volumes:
      - core-data:/data
    environment:
      # LLM 引导密钥（首次配置用；之后配置持久化在 /data，可留空）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 显式指定令牌时覆盖数据卷里的自动生成值
      LITEWORK_TOKEN: ${LITEWORK_TOKEN:-}
    # 4GB 内存护栏：给 OS/内核留 ~500MB，避免 OOM 时内核乱杀进程
    mem_limit: 3500m
    # Chromium 渲染需要大 /dev/shm（默认 64MB 会崩标签页）
    shm_size: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  core-data:
