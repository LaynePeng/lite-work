[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lite-work"
dynamic = ["version"]
license = { text = "Apache-2.0" }
description = "lite-work - 手写内核的通用 AI Agent 桌面应用"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "tree-sitter>=0.24",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-go>=0.23",
    "pathspec>=0.12",
    # 办公/生产力场景（AGI 通用入口）：文档、表格、演示、图表、数据分析
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.21",
    "reportlab>=4.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    # 办公文件读取（调研/参考场景）
    "pypdf>=5",
    # OCR 识别：图片/PDF/PPT 内嵌图片文字提取
    "rapidocr-onnxruntime>=1.4",
    "pymupdf>=1.28",
    # Web 抓取 TLS 指纹兜底（对抗 Cloudflare JA3 检测）
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
]
package = [
    "pyinstaller>=6.10",
]

[project.scripts]
lite-work = "litework.cli:main"

[tool.setuptools.packages.find]
include = ["litework*"]

# 版本单一事实源：litework/__init__.py 的 __version__
[tool.setuptools.dynamic]
version = {attr = "litework.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 每个测试默认 60s 超时（thread 法可强制中断），防止个别测试挂住拖死整轮测试；
# pytest-timeout 属于开发依赖，未安装时该参数会导致 pytest 报错，按需 pip install pytest-timeout
addopts = "--timeout=60 --timeout-method=thread"
