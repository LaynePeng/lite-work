<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; background: #f5f4f0; color: #111111;
    font-family: "Helvetica Neue", Helvetica, -apple-system, "PingFang SC", "Segoe UI", sans-serif;
  }
  .logo { width: 76px; height: 76px; }
  .title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .spinner {
    width: 34px; height: 34px; border: 3px solid #e4e2dc;
    border-top-color: #e63312; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 12px; color: #767471; min-height: 20px; text-transform: uppercase; letter-spacing: 0.08em; }
  .progress { width: 240px; height: 4px; background: #e4e2dc; overflow: hidden; }
  .progress-fill {
    width: 0; height: 100%;
    background: #e63312;
    transition: width 0.4s ease;
  }
  .error {
    display: none; flex-direction: column; align-items: center; gap: 12px;
    font-size: 13px; color: #d32b0e;
  }
  .error button {
    padding: 8px 22px; border-radius: 0; border: 1px solid #111111; cursor: pointer;
    background: #e63312; color: #fff; font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
</style>
</head>
<body>
  <!-- 应用图标（瑞士风格：纸白底 + 墨黑描边 + 红方块） -->
  <div class="logo">
    <svg viewBox="0 0 1024 1024" width="76" height="76" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="0" y="0" width="1024" height="1024" rx="0" fill="#111111"/>
      <rect x="40" y="40" width="944" height="944" fill="#f5f4f0"/>
      <rect x="40" y="40" width="200" height="200" fill="#e63312"/>
      <path d="M635 90 L370 440 L465 440 L355 670 L710 360 L590 360 L695 90 Z" fill="#111111"/>
      <g transform="translate(512 830)" fill="#111111">
        <rect x="-20" y="-160" width="40" height="85" rx="0" fill="#111111"/>
        <rect x="-20" y="-160" width="40" height="85" rx="0" fill="#111111" transform="rotate(45)"/>
        <rect x="-20" y="-160" width="40" height="85" rx="0" fill="#111111" transform="rotate(90)"/>
        <rect x="-20" y="-160" width="40" height="85" rx="0" fill="#111111" transform="rotate(135)"/>
        <rect x="-20" y="-160" width="40" height="85" rx="0" fill="#111111" transform="rotate(180)"/>
        <rect x="-20" y="-160" width="40" height="85" rx="0" fill="#111111" transform="rotate(225)"/>
        <rect x="-20" y="-160" width="40" height="85" rx="0" fill="#111111" transform="rotate(270)"/>
        <rect x="-20" y="-160" width="40" height="85" rx="0" fill="#111111" transform="rotate(315)"/>
        <circle r="105" fill="#111111"/>
        <circle r="42" fill="#f5f4f0"/>
      </g>
    </svg>
  </div>
  <div class="title">lite—work</div>
  <div class="spinner"></div>
  <div class="progress"><div class="progress-fill" id="fill"></div></div>
  <div class="status" id="status">正在启动内核…</div>
  <div class="error" id="errorBox">
    <div>后端启动失败</div>
    <button onclick="location.reload()">重试</button>
  </div>
  <script>
    // 由 Electron 注入的加载页：轮询后端就绪状态
    let step = 0;
    const steps = [
      "正在启动内核…", "加载安全策略…", "准备代码工具…", "连接模型服务…", "即将就绪…",
    ];
    setInterval(() => {
      step = Math.min(step + 1, steps.length - 1);
      document.getElementById("status").textContent = steps[step];
      document.getElementById("fill").style.width = (step / (steps.length - 1)) * 100 + "%";
    }, 4000);
  </script>
</body>
</html>
